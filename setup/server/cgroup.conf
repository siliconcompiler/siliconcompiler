# cgroup/v2, managed by slurmd itself.
#
# IgnoreSystemd is required because this container has no systemd: slurmd sets
# up a systemd scope for slurmstepd over DBus by default, and without one it
# dies with "fatal: systemd scope for slurmstepd could not be set". With this
# set it builds the unified hierarchy by hand instead, which is why
# /sys/fs/cgroup has to be writable -- see the scrunner service in
# docker-compose.yml.
#
# EnableControllers pushes the controllers slurmd needs (cpu, cpuset, memory)
# down cgroup.subtree_control to Slurm's own leaf; a container's delegated
# cgroup does not have them enabled all the way down by default.
CgroupPlugin=autodetect
IgnoreSystemd=yes
EnableControllers=yes
