# A local SiliconCompiler server backed by a real slurm cluster.
#
#   docker compose up --build      # http://localhost:8080
#
# Self-contained by design: one locally-built image (see Dockerfile), public
# base images only, and no bind mounts -- all shared state lives in named
# volumes, so nothing here depends on a path or a file outside this repo.
#
# The database password is the only credential, it is never published outside
# the compose network, and it can be overridden:
#
#   SC_SLURM_DB_PASSWORD=... docker compose up --build

name: sc-server-slurm

# Every slurm service is the same image in a different role. Compose builds it
# once and the rest hit the cache.
x-sc-slurm: &sc-slurm
  build:
    context: ../..
    dockerfile: setup/server/Dockerfile
    args:
      # The sc_tools image to build on: it supplies slurm, slurmrestd and the
      # EDA tools, and this Dockerfile adds only siliconcompiler. Override to
      # build against a different one:
      #
      #   SC_TOOLS_IMAGE=ghcr.io/siliconcompiler/sc_tools:<tag> \
      #     docker compose up --build
      #
      # CI passes the image its docker_image job resolved, so the stack is
      # exercised against the same one as the rest of the suite.
      SC_TOOLS_IMAGE: ${SC_TOOLS_IMAGE:-ghcr.io/siliconcompiler/sc_tools:latest}
      # Empty in a normal checkout, where setuptools_scm reads the version out
      # of .git itself. Set when building from a git WORKTREE, whose .git is a
      # pointer to a directory outside the build context -- compose.sh works it
      # out and passes it, and the Dockerfile says so if it is missing.
      SC_VERSION: ${SC_VERSION:-}
  image: sc-server-slurm:local
  environment:
    SC_SLURM_DB_PASSWORD: ${SC_SLURM_DB_PASSWORD:-sc_test_only}
  volumes:
    # Every slurm daemon must present the same munge credential. The key is
    # generated into this volume by whichever container starts first rather
    # than baked into the image: any repo edit invalidates the image layers,
    # so a baked key would change on every rebuild and rebuilding one service
    # would break its authentication against the others.
    - munge-key:/etc/munge

# Compute nodes. Scale freely:
#
#   docker compose up --build --scale scrunner=4
#
# No hostname is pinned and no node is named in slurm.conf: each slurmd
# registers itself with "slurmd -Z", and the controller records the address and
# hostname it registers with. So replicas need nothing unique configured, and
# scaling needs no edit anywhere.
x-scrunner: &scrunner
  <<: *sc-slurm
  command: ["node"]
  # The only service needing extra privilege, and only for slurmd's cgroup
  # setup -- the tasks it runs need nothing beyond a normal container. slurmd
  # puts slurmstepd in a cgroup of its own and, with IgnoreSystemd=yes, builds
  # that hierarchy by hand, which needs /sys/fs/cgroup writable. It gets its
  # own cgroup namespace and remounts that read-write, so no host path is bind
  # mounted and nothing it writes escapes the namespace. CAP_SYS_ADMIN alone
  # is not enough: on an AppArmor host the profile is what refuses the
  # remount ("cannot remount cgroup read-write, is write-protected").
  cgroup: private
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
  volumes:
    - munge-key:/etc/munge
    - sc-server-data:/sc_server
  depends_on:
    - scserver

services:
  # Accounting database. Root gets a throwaway random password nobody needs:
  # slurmdbd connects as the unprivileged "slurm" user, and the port is not
  # published to the host.
  slurmdb:
    image: mariadb:11
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: ${SC_SLURM_DB_PASSWORD:-sc_test_only}
    volumes:
      - slurmdb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  slurmdbd:
    <<: *sc-slurm
    hostname: slurmdbd
    command: ["dbd"]
    depends_on:
      slurmdb:
        condition: service_healthy

  # A registry on the internal network, so the whole image path can be
  # exercised without pushing anything off this machine.
  #
  # 🔴 It is here because the alternative is not testing it. "srun --container"
  # takes an unpacked bundle, sc-server unpacks it from a registry reference,
  # and the digest pinned at registration is the thing that makes two runs a
  # month apart the same code. None of that is exercised by an image that only
  # ever existed in the local docker daemon -- a locally built image has no
  # repository digest at all, which is why registering one is refused.
  #
  # Plain HTTP, named as insecure in registries.conf. Published on loopback so
  # "publish.sh" can push to it from the host; the cluster reaches it as
  # registry:5000 over the compose network.
  registry:
    image: registry:2
    hostname: registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  # Controller and submit host: slurmctld, slurmrestd, and the SiliconCompiler
  # server itself.
  scserver:
    <<: *sc-slurm
    hostname: scserver
    command: ["ctld"]
    # Loopback only. This deployment runs the unauthenticated profile: nothing
    # verifies who a caller is, and the DPoP key bound on first contact is the
    # only real control it has. Published on 0.0.0.0 it would be reachable by
    # anything that can route to this host. "Reachable from my own machine" is
    # all the stack needs; exposing it more widely means an identity provider
    # and firewalling first.
    ports:
      - "127.0.0.1:8080:8080"   # the v1 API
      - "127.0.0.1:6820:6820"   # slurmrestd, built but not yet used by SC
    volumes:
      - munge-key:/etc/munge
      - sc-server-data:/sc_server
    depends_on:
      - slurmdbd

  scrunner:
    <<: *scrunner
    # Two by default, and the second one earns its keep: every node of a flow
    # is submitted to Slurm as a job of its own, so a run really does spread
    # across compute nodes. With one runner that fan-out is invisible -- the
    # flow would finish either way and nothing would show whether the cluster
    # was being used as a cluster. Scale up or down from here with
    # "--scale scrunner=N"; nothing is configured per replica.
    deploy:
      replicas: 2

volumes:
  # What the local registry keeps. Its own volume rather than the shared tree:
  # it is a registry's storage, not the deployment's data, and wiping one
  # should not wipe the other.
  registry-data:

  # The shared filesystem, mounted at /sc_server and handed to the server as
  # -datadir. The server lays it out itself:
  #
  #   server.db                       the job store
  #   artifacts/<job>/                what a finished run left behind
  #   users/<user>/builds/<job>/      one directory per user per job, written by
  #                                   the server and read back by the compute
  #                                   node at the same path
  #   users/<user>/cache/             that user's downloaded PDKs and data
  #                                   packages
  #
  # Per user rather than cluster-wide: ccache and coursier create their own
  # directories, so under one shared tree they land with the first user's uid
  # and the second gets EPERM -- and chmod is owner-only, so the server cannot
  # repair a directory it did not create. The cost is one copy of each PDK per
  # user rather than one per cluster.
  #
  # It is on this volume rather than in each container's ~/.sc because a compute
  # node need not share a home directory with the server, and because the
  # scheduler hands the server's cachedir to the node -- so it has to be a path
  # they both see.
  sc-server-data:
  munge-key:
  slurmdb-data:
