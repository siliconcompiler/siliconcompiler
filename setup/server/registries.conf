# Container registries this cluster may pull from.
#
# The compose stack runs its own registry on the internal network so the whole
# image path can be exercised without pushing anything outside the machine. It
# speaks plain HTTP, so it has to be named here -- skopeo refuses an unverified
# TLS endpoint otherwise, which is the correct default and the reason this
# exception is written down rather than passed as a flag at the call site.
#
# 🔴 This file is also where a real deployment puts its registry ALLOWLIST.
# The schema stores the digest of what an operator approved; limiting which
# registries can be reached at all is config, and this is the config.

[[registry]]
location = "registry:5000"
insecure = true
