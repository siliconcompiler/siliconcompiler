# How Slurm runs a container, for "srun --container <bundle>".
#
# Without this file Slurm refuses --container outright, which is the first
# thing to check if a containerised node fails with nothing useful in its log.
#
# crun rather than runc: it is a C implementation with the same interface and
# no Go runtime to carry, and it is what Slurm's own documentation uses in this
# example. The four commands below are the whole OCI lifecycle -- Slurm calls
# create/start or run, asks state, and kills and deletes on the way out.
#
# %b is the bundle path, and it is the only substitution here: sc-server
# unpacks each registered image to <datadir>/images/<digest>/ and hands Slurm
# that directory. %n.%u.%j.%s.%t is a container name unique per node, user,
# job, step and task, so two tasks of the same job never collide.
#
# 🔴 MOUNTS ARE NOT HERE, and that is deliberate. They live in each bundle's
# own config.json, written when sc-server stages it, because the shared tree a
# job needs is the server's business and not the cluster's -- and because a
# mount added here would apply to every container Slurm ever runs, including
# ones this server knows nothing about.

# 🔴 --root is explicit, and leaving it out was a real bug rather than a
# tidiness point: crun took the value of --rootless as its state directory and
# then failed looking for `false/<container>/status`, which reads like a
# missing container and not like a misparsed flag.
#
# 🔴 --no-new-keyring and --no-pivot because slurmd is itself inside a
# container here. Creating a session keyring is not permitted ("create keyring
# ...: Operation not permitted"), and pivot_root needs the new root to be a
# mount point that is not shared, which it is not on a docker volume
# ("pivot_root: Operation not permitted"). --no-pivot falls back to chroot.
#
# ⚠️ Both are concessions to running a cluster inside containers. A cluster on
# real hardware needs neither, and is not harmed by either.
#
# ⚠️ slurmd reads this file ONCE, at startup. Editing it and wondering why
# nothing changed is the obvious trap: restart the runners.

IgnoreFileConfigJson=false
CreateEnvFile=newline

RunTimeQuery="crun --root=/run/crun state %n.%u.%j.%s.%t"
RunTimeKill="crun --root=/run/crun kill -a %n.%u.%j.%s.%t SIGTERM"
RunTimeDelete="crun --root=/run/crun delete --force %n.%u.%j.%s.%t"
RunTimeRun="crun --root=/run/crun run --no-new-keyring --no-pivot --bundle %b %n.%u.%j.%s.%t"
