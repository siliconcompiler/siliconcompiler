# Slurm configuration for the local test cluster in docker-compose.yml.
#
# Hostnames are compose service names, so this file can be baked into the image
# rather than templated at boot: the controller is always "scserver" and the
# compute node is always "scrunner".

ClusterName=sc_test
SlurmctldHost=scserver
SlurmUser=slurm

# Neither of these uses cgroups: process tracking is by /proc walk and there is
# no task-level containment. That does NOT mean the cluster is cgroup-free --
# slurmd puts slurmstepd in a cgroup of its own regardless of these plugins, so
# cgroup.conf is shipped alongside this file and the compute node needs a
# writable cgroup hierarchy to start at all. See cgroup.conf and the scrunner
# service in docker-compose.yml.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
MpiDefault=none
SwitchType=switch/none

SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmdSpoolDir=/sc_tools/spool/slurmd
StateSaveLocation=/sc_tools/spool/slurm

# No log files on purpose -- with the daemons in the foreground this sends
# everything to "docker compose logs".


# SCHEDULING
SchedulerType=sched/builtin

# Dynamic nodes are only supported with cons_tres, and MaxNodeCount is the
# ceiling on how many may register at once.
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU
MaxNodeCount=64
MinJobAge=30
MessageTimeout=30
SrunPortRange=50001-52000

# ACCOUNTING -- slurmdbd, backed by the mariadb service.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
JobAcctGatherType=jobacct_gather/none

# The REST API. Built and started so the endpoint exists; nothing in
# SiliconCompiler calls it yet. Over TCP slurmrestd cannot use munge, so it
# authenticates with JWT, and entrypoint.sh generates the key at boot.
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/sc_tools/spool/slurm/jwt_hs256.key

# COMPUTE NODES and PARTITIONS
#
# There are no NodeName lines: the runners register themselves. Each starts
# "slurmd -Z", and the controller records the NodeAddr and NodeHostname it
# registers with, so nothing here has to know their names or addresses and
# "docker compose up --scale scrunner=N" needs no config change at all.
#
# Nodes=ALL is what puts a freshly registered node into a partition.
#
# TWO partitions, because a run submits two very different kinds of work:
#
#   compute     where a node's task runs -- EDA tools, real cores, real memory
#   coordinate  where the run's own orchestrating process runs. It loads the
#               manifest, drives the flow and submits every node as a job of
#               its own; it computes nothing and holds one core for as long as
#               the flow takes
#
# Without the split that orchestrator sits in a compute slot doing nothing for
# the length of the run, which on a busy cluster is the most expensive idle
# process on it. The server puts it here with "batch_queue": "coordinate" in
# its config.json.
#
# They overlap on the same nodes because this stack has one node. A real
# cluster would give "coordinate" a small machine of its own; MaxCPUsPerNode
# is what stands in for that here -- it caps what the partition can take, so
# compute work cannot quietly end up living in it.
#
# Default=YES matters and belongs on "compute": that is what a node's task gets
# when nothing names a partition, and get_slurm_partition() finds it via the
# "*" sinfo appends.
PartitionName=compute Nodes=ALL Default=YES State=UP
PartitionName=coordinate Nodes=ALL MaxCPUsPerNode=4 State=UP
