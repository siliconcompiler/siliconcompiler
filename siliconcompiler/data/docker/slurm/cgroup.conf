# Nothing in slurm.conf uses cgroups -- proctrack/linuxproc, task/none and
# jobacct_gather/none between them never call into the cgroup layer -- so this
# turns the whole subsystem off.
#
# It has to be said explicitly. slurmd sets up a systemd scope for slurmstepd
# on its own, independently of those plugins, so the default (autodetect) finds
# cgroup v2 in a container and fails one of two ways:
#
#   - with systemd:  "fatal: systemd scope for slurmstepd could not be set"
#     because there is no DBus to ask
#   - with IgnoreSystemd=yes: "unable to open
#     '/sys/fs/cgroup/cgroup.subtree_control' for writing: Read-only file
#     system", because building the hierarchy by hand needs a writable
#     /sys/fs/cgroup that an unprivileged container does not get
#
# "disabled" avoids both without a host bind mount or a privileged container.
CgroupPlugin=disabled
