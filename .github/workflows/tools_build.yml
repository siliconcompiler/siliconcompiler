name: 'Tools building CI'

on:
  # Manual Dispatch
  workflow_dispatch:
    inputs:
      tools:
        type: string
        default: ''
        description: 'Comma-separated tools to build (empty = all), e.g. "magic,ghdl"'
      os:
        type: string
        default: ''
        description: 'Comma-separated OSes (empty = all), e.g. "ubuntu26,rhel9"'
      arch:
        type: string
        default: ''
        description: 'Comma-separated arches (empty = all): x86_64,aarch64'

  # Weekly full-matrix build to catch tool-build regressions. Only fires from
  # the default branch; scheduled runs pass no inputs, so the whole matrix runs.
  schedule:
    - cron: '0 4 * * 0'

defaults:
  run:
    shell: bash

concurrency:
  # Fold the dispatch inputs into the group so runs targeting different
  # tool/os/arch subsets run concurrently instead of cancelling each other;
  # re-dispatching the same selection still supersedes the in-progress run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tools }}-${{ inputs.os }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  matrix:
    name: 'Generate build matrix'
    runs-on: ubuntu-latest

    outputs:
      tools: ${{ steps.matrix.outputs.tools }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate tool docker files
        id: matrix
        run: |
          matrix=$(python3 .github/workflows/bin/build_matrix.py \
            --tools "${{ inputs.tools }}" \
            --os "${{ inputs.os }}" \
            --arch "${{ inputs.arch }}")
          echo "tools=${matrix}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runon }}
    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.tools) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build
        run: |
          cd ${{ matrix.path }}
          docker build ../.. --file Docker.testbuild --build-arg="SC_INSTALL_SCRIPT=${{ matrix.script }}"
