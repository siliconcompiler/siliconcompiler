name: Docs link check

# Deliberately not run per-PR. External links go down, get rate-limited, and
# come back on their own, so gating merges on them would train everyone to
# ignore a red check. A weekly run that opens an issue keeps the signal.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # This job installs the package and runs a Sphinx build, which executes
      # extension and example code. Do not leave a credentialed remote behind
      # for that to find; the issue-filing step below supplies its own token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz xdot
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install .[docs]

      - name: Run linkcheck
        id: linkcheck
        run: |
          . .venv/bin/activate
          # linkcheck reports failures through its exit status; capture the
          # output either way so the issue body has something useful in it.
          set +e
          make -C docs linkcheck 2>&1 | tee linkcheck.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Broken links'
            echo '```'
            grep -E '^\(.*\) (broken|redirect)' docs/_build/linkcheck/output.txt 2>/dev/null \
              || echo 'none'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue on failure
        if: steps.linkcheck.outputs.status != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let broken = 'See the workflow run for details.';
            try {
              broken = fs.readFileSync('docs/_build/linkcheck/output.txt', 'utf8')
                         .split('\n').slice(0, 100).join('\n');
            } catch (e) {}
            const title = 'Docs link check failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'documentation',
            });
            const body = `The weekly documentation link check found broken links.\n\n` +
                         `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                         `/actions/runs/${context.runId}\n\n\`\`\`\n${broken}\n\`\`\``;
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['documentation'],
              });
            }
